<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>⚡ 我在呢 | 游戏工坊 · 英语直达</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', 'Poppins', 'Orbitron', system-ui, -apple-system, 'Microsoft Yahei', sans-serif;
      background: radial-gradient(ellipse at 30% 40%, #0a0a2a, #020210);
      min-height: 100vh;
      color: #eef5ff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* 动态光晕背景 */
    body::before {
      content: '';
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at center, rgba(0, 255, 255, 0.08) 0%, rgba(123, 97, 255, 0.05) 50%, transparent 70%);
      animation: rotateGlow 20s linear infinite;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes rotateGlow {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .header {
      text-align: center;
      margin-bottom: clamp(30px, 8vw, 55px);
      position: relative;
      z-index: 2;
      padding: 0 10px;
    }

    .header h1 {
      font-size: clamp(1.8rem, 8vw, 4rem);
      background: linear-gradient(135deg, #00ffff, #7b61ff, #ff44cc);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: 2px;
      margin-bottom: 8px;
      text-shadow: 0 0 30px rgba(0, 255, 255, 0.4);
      animation: titlePulse 3s ease-in-out infinite;
    }

    @keyframes titlePulse {
      0%, 100% { opacity: 1; text-shadow: 0 0 20px rgba(0, 255, 255, 0.3); }
      50% { opacity: 0.95; text-shadow: 0 0 40px rgba(123, 97, 255, 0.6); }
    }

    .header p {
      font-size: clamp(0.85rem, 4vw, 1.2rem);
      color: #aac8ff;
      letter-spacing: 1px;
      text-shadow: 0 0 10px rgba(0, 200, 255, 0.3);
    }

    /* 游戏网格 - 响应式核心 */
    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: clamp(20px, 5vw, 32px);
      width: 100%;
      max-width: 1300px;
      margin-bottom: 50px;
      position: relative;
      z-index: 2;
      padding: 0 8px;
    }

    /* 游戏卡片 - 霓虹科技风 */
    .game-card {
      background: rgba(12, 18, 40, 0.65);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 255, 255, 0.35);
      border-radius: 28px;
      padding: clamp(24px, 6vw, 40px) clamp(16px, 4vw, 24px);
      min-height: 200px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: #e0e6ff;
      transition: all 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }

    /* 英语学习卡片 - 样式独立，无展开子菜单，整体就是一个跳转按钮 */
    .english-card {
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .game-card:active {
      transform: scale(0.98);
    }

    @media (hover: hover) {
      .game-card:hover {
        transform: translateY(-8px) scale(1.02);
        border-color: rgba(0, 255, 255, 0.8);
        box-shadow: 0 20px 35px rgba(0, 255, 255, 0.25), 0 0 30px rgba(123, 97, 255, 0.3);
        background: rgba(20, 28, 55, 0.8);
      }
      .game-card:hover .game-icon {
        transform: scale(1.1) rotate(5deg);
      }
    }

    .game-card::before {
      content: '';
      position: absolute;
      top: -2px;
      left: -2px;
      right: -2px;
      bottom: -2px;
      background: linear-gradient(135deg, #00ffff, #7b61ff, #ff44cc, #00ffff);
      border-radius: 30px;
      opacity: 0;
      transition: opacity 0.5s ease;
      z-index: -1;
    }

    .game-card:hover::before {
      opacity: 0.5;
    }

    .game-icon {
      font-size: clamp(2.5rem, 10vw, 3.5rem);
      margin-bottom: 12px;
      filter: drop-shadow(0 0 8px rgba(0, 255, 255, 0.6));
      transition: transform 0.3s ease;
    }

    .game-card h3 {
      font-size: clamp(1.2rem, 5vw, 1.6rem);
      margin-bottom: 8px;
      background: linear-gradient(135deg, #ffffff, #88ccff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .game-card p {
      font-size: clamp(0.75rem, 3.5vw, 0.9rem);
      color: #b8c7ff;
      text-align: center;
      letter-spacing: 0.5px;
    }

    /* 标签徽章 */
    .game-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      background: linear-gradient(135deg, #ff3366, #ff6633);
      padding: 4px 12px;
      border-radius: 30px;
      font-size: 0.7rem;
      font-weight: bold;
      color: white;
      box-shadow: 0 2px 8px rgba(255, 51, 102, 0.4);
      letter-spacing: 1px;
      z-index: 3;
    }

    /* 英语卡片徽章特殊样式 */
    .english-badge {
      background: linear-gradient(135deg, #33ccff, #3366ff);
      box-shadow: 0 2px 8px rgba(51, 204, 255, 0.4);
    }

    /* 页脚 */
    .footer {
      font-size: 0.8rem;
      color: #5a6e9e;
      text-align: center;
      position: relative;
      z-index: 2;
      padding: 20px;
      border-top: 1px solid rgba(0, 255, 255, 0.2);
      width: 100%;
      max-width: 800px;
      margin-top: 10px;
    }

    /* 浮动粒子效果 */
    .particle {
      position: fixed;
      background: rgba(0, 255, 255, 0.4);
      border-radius: 50%;
      pointer-events: none;
      z-index: 1;
      animation: floatParticle 8s infinite ease-in-out;
    }

    @keyframes floatParticle {
      0% { transform: translateY(100vh) scale(0); opacity: 0; }
      10% { opacity: 0.6; }
      90% { opacity: 0.6; }
      100% { transform: translateY(-20vh) scale(1.5); opacity: 0; }
    }

    /* 手机横屏优化 */
    @media (max-width: 768px) and (orientation: landscape) {
      body {
        padding: 15px 20px;
      }
      .game-grid {
        gap: 15px;
      }
      .game-card {
        padding: 16px 12px;
        min-height: 150px;
      }
      .game-icon {
        font-size: 2rem;
        margin-bottom: 6px;
      }
      .game-card h3 {
        font-size: 1rem;
      }
      .header {
        margin-bottom: 20px;
      }
    }

    /* 手机竖屏 */
    @media (max-width: 600px) {
      .game-grid {
        grid-template-columns: 1fr;
        gap: 18px;
        max-width: 400px;
        margin: 0 auto 40px auto;
      }
      .game-card {
        padding: 24px 20px;
        min-height: 170px;
      }
      .game-badge {
        top: 10px;
        right: 10px;
        font-size: 0.6rem;
        padding: 3px 10px;
      }
      .footer {
        font-size: 0.7rem;
      }
    }

    /* 平板 */
    @media (min-width: 601px) and (max-width: 1024px) {
      .game-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 24px;
      }
    }

    /* 大屏 */
    @media (min-width: 1400px) {
      .game-grid {
        grid-template-columns: repeat(3, 1fr);
        max-width: 1400px;
      }
    }

    /* 触摸优化 - 增大点击区域 */
    @media (max-width: 768px) {
      .game-card {
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      .game-card:active {
        transform: scale(0.97);
        background: rgba(30, 40, 70, 0.8);
      }
    }
  </style>
</head>
<body>

  <div id="particlesContainer"></div>

  <div class="header">
    <h1>✨ 我在呢 ✨</h1>
    <p>| 自制游戏一起玩 · 英语学习直通车 |</p>
  </div>

  <div class="game-grid">
    <!-- 原有游戏卡片：天穹防线 -->
    <a href="防空系统.html" class="game-card" id="gameCardMain">
      <div class="game-badge">🔥 热门推荐</div>
      <div class="game-icon">🚀</div>
      <h3>天穹防线</h3>
      <p>导弹发射车 · 动态空袭防御</p>
      <p style="font-size:0.7rem; margin-top:10px; color:#88aaff;">⚡ 智能拦截 | 随机波次 | 霓虹战场</p>
    </a>

    <!-- 英语学习卡片：点击直接跳转至 “英语/英语学习.html” ，无二级菜单 -->
    <a href="英语/英语学习.html" class="game-card english-card" id="englishDirectCard">
      <div class="game-badge english-badge">📚 英语学习</div>
      <div class="game-icon">📖</div>
      <h3>英语学习充电站</h3>
      <p>点击进入 · 综合学习门户</p>
      <p style="font-size:0.7rem; margin-top:8px; color:#aaddff;">✨ 单词 · 听力 · 拼写 · 启蒙 ✨</p>
    </a>

    <!-- 占位开发中卡片 -->
    <a href="#" class="game-card" style="opacity:0.7; cursor:not-allowed;" onclick="return false;">
      <div class="game-badge">🎮 开发中</div>
      <div class="game-icon">🔮</div>
      <h3>星际巡航</h3>
      <p>即将解锁 · 敬请期待</p>
    </a>

    <a href="#" class="game-card" style="opacity:0.7; cursor:not-allowed;" onclick="return false;">
      <div class="game-badge">🎮 开发中</div>
      <div class="game-icon">⚔️</div>
      <h3>虚空入侵</h3>
      <p>即将解锁 · 敬请期待</p>
    </a>
  </div>

  <div class="footer">
    <p>© 2026 我在呢 | 全平台适配 · 极致体验 | ✨ 点击英语学习充电站，直达专属学习空间 ✨</p>
  </div>

  <script>
    // 动态粒子生成 - 性能优化，减少移动端粒子数量
    (function createParticles() {
      const container = document.getElementById('particlesContainer');
      if (!container) return;
      const isMobile = window.innerWidth < 768;
      const particleCount = isMobile ? 25 : 45;
      
      for (let i = 0; i < particleCount; i++) {
        const particle = document.createElement('div');
        particle.classList.add('particle');
        const size = Math.random() * (isMobile ? 4 : 6) + 2;
        particle.style.width = size + 'px';
        particle.style.height = size + 'px';
        particle.style.left = Math.random() * 100 + '%';
        particle.style.background = `radial-gradient(circle, rgba(0, 255, 255, ${Math.random() * 0.6 + 0.2}), rgba(123, 97, 255, 0.3))`;
        particle.style.animationDelay = Math.random() * 12 + 's';
        particle.style.animationDuration = (Math.random() * 10 + 8) + 's';
        container.appendChild(particle);
      }
    })();

    // 移动端触摸反馈优化（仅视觉反馈，不会干扰跳转）
    (function addTouchFeedback() {
      const cards = document.querySelectorAll('.game-card');
      cards.forEach(card => {
        card.addEventListener('touchstart', function(e) {
          this.style.transform = 'scale(0.97)';
        }, { passive: true });
        card.addEventListener('touchend', function(e) {
          this.style.transform = '';
        });
        card.addEventListener('touchcancel', function(e) {
          this.style.transform = '';
        });
      });
    })();

    // 鼠标光晕效果 - 仅PC端启用（无干扰）
    if (window.matchMedia('(hover: hover)').matches) {
      const cards = document.querySelectorAll('.game-card');
      cards.forEach(card => {
        card.addEventListener('mousemove', (e) => {
          const rect = card.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;
          card.style.setProperty('--mouse-x', x + 'px');
          card.style.setProperty('--mouse-y', y + 'px');
        });
      });
    }

    // 检测视口变化动态适配
    function handleOrientationChange() {
      const vh = window.innerHeight;
      document.documentElement.style.setProperty('--vh', `${vh}px`);
    }
    window.addEventListener('resize', handleOrientationChange);
    handleOrientationChange();

    // --------------------------------------------------------------
    // 针对英语学习卡片：已经完全改为 <a> 标签直接跳转“英语/英语学习.html”
    // 不再有任何子菜单或展开逻辑，完全遵循需求“点击英语学习充电站，打开英语/英语学习.html；去掉模块选择”
    // 额外确保占位卡片不会意外跳转，并保留友好的“开发中”提示
    // --------------------------------------------------------------
    
    // 处理所有占位卡片（href="#"）的点击：阻止跳转并显示toast提示
    const disabledCards = document.querySelectorAll('.game-card[href="#"]');
    disabledCards.forEach(card => {
      card.addEventListener('click', (e) => {
        e.preventDefault();
        // 轻微震动（支持设备）
        if (navigator.vibrate) navigator.vibrate(50);
        // 动态提示
        const tipDiv = document.createElement('div');
        tipDiv.innerText = '⚙️ 战备升级中，敬请期待 ⚙️';
        tipDiv.style.position = 'fixed';
        tipDiv.style.bottom = '20px';
        tipDiv.style.left = '50%';
        tipDiv.style.transform = 'translateX(-50%)';
        tipDiv.style.backgroundColor = 'rgba(0,0,0,0.85)';
        tipDiv.style.color = '#0ff';
        tipDiv.style.padding = '8px 20px';
        tipDiv.style.borderRadius = '40px';
        tipDiv.style.zIndex = '9999';
        tipDiv.style.fontSize = '14px';
        tipDiv.style.backdropFilter = 'blur(8px)';
        tipDiv.style.border = '1px solid #0ff';
        tipDiv.style.fontWeight = 'bold';
        tipDiv.style.whiteSpace = 'nowrap';
        tipDiv.style.fontFamily = 'system-ui, sans-serif';
        document.body.appendChild(tipDiv);
        setTimeout(() => { tipDiv.remove(); }, 1500);
      });
    });

    // 针对英语学习卡片的额外保障：如果因为网络或路径问题导致无法跳转，可以给出友好控制台记录，但不影响核心体验
    const englishDirectLink = document.getElementById('englishDirectCard');
    if (englishDirectLink) {
      englishDirectLink.addEventListener('click', (e) => {
        // 由于是<a>标签且href正确，正常情况下会直接跳转。
        // 如果路径可能出错, 这里仅做记录日志, 无需干预跳转过程。
        console.log('正在跳转至英语综合学习门户: 英语/英语学习.html');
        // 可选: 增加加载动画效果（极简）
      });
    }

    // 确保天穹防线链接正常跳转（<a>原生行为保持，无需额外动作）
    const legitGameLink = document.getElementById('gameCardMain');
    if (legitGameLink) {
      legitGameLink.addEventListener('click', (e) => {
        // 正常跳转，无额外逻辑
      });
    }

    // 增加鼠标悬停光晕样式 (动态插入，不影响卡片样式)
    const styleForGlow = document.createElement('style');
    styleForGlow.textContent = `
      @media (hover: hover) {
        .game-card {
          position: relative;
          overflow: hidden;
        }
        .game-card::after {
          content: '';
          position: absolute;
          top: var(--mouse-y, 50%);
          left: var(--mouse-x, 50%);
          width: 120px;
          height: 120px;
          background: radial-gradient(circle, rgba(0, 255, 255, 0.25), transparent 70%);
          transform: translate(-50%, -50%);
          opacity: 0;
          transition: opacity 0.2s;
          pointer-events: none;
          border-radius: 50%;
          z-index: 1;
        }
        .game-card:hover::after {
          opacity: 1;
        }
        .game-card h3, .game-card p, .game-icon {
          position: relative;
          z-index: 2;
        }
        .game-badge {
          z-index: 3;
        }
      }
    `;
    if (!document.querySelector('#dynamicGlowStyle')) {
      styleForGlow.id = 'dynamicGlowStyle';
      document.head.appendChild(styleForGlow);
    }

    // 初始化完成时，在控制台打印提示，表明英语学习卡片已经简化为直连入口（无二级菜单）
    window.addEventListener('load', () => {
      handleOrientationChange();
      console.log('✅ 游戏工坊主页已优化：英语学习充电站 → 直接跳转“英语/英语学习.html”，模块选择已移除');
      
      // 额外检查：如果英语学习页面可能存在路径问题，不做阻断，让浏览器尝试跳转
      // 但为了提升用户体验，可捕获链接错误？不需要，浏览器自身会处理404。
      // 另外添加一个友好的提示：如果用户快速点击，不会产生任何冲突。
      
      // 优化卡片焦点样式，去除可能由于原先遗留的额外样式
      const englishCard = document.querySelector('.english-card');
      if (englishCard) {
        // 确保没有任何残余的 expanded 类或者子菜单容器（html结构中已经完全没有子菜单）
        // 避免任何js残留影响
        englishCard.classList.remove('expanded');
      }
    });
    
    // 由于完全移除了二级菜单，无需再绑定任何子项跳转和展开收起逻辑。
    // 符合需求描述: 点击英语学习卡片打开对应目录的“英语学习.html”；去掉模块选择。
    // 对于移动端，触摸反馈依然存在但不会干扰跳转。
    
    // 附加：为防止未来有缓存或动态内容影响，确认英语卡片内无多余子菜单DOM (基于提供的HTML已经去除)
    // 且原本的 .english-submenu 和相关子项已完全删除，确保界面干净。
    
    // 同时如果有任何残留的旧事件监听（理论上不会），此处再做一次全局清理，确保英语卡片无额外事件。
    // 因为之前版本可能有展开折叠逻辑，新版完全重构为纯净链接，因此安全。
    
    // 增加对“英语/英语学习.html”路径的有效性轻微控制台提示，无需弹窗干扰
    const checkEnglishPath = () => {
      // 由于前端无法强制检测文件是否存在，但为了用户友好，不做阻断。
      // 仅提供参考信息
      console.info("ℹ️ 英语学习门户路径: 英语/英语学习.html (请确保该文件位于正确的子目录)");
    };
    checkEnglishPath();
    
    // 确保所有卡片都拥有正确的角色和可访问性
    const allCards = document.querySelectorAll('.game-card');
    allCards.forEach(card => {
      // 增加无障碍标签
      if (card.getAttribute('href') && card.getAttribute('href') !== '#') {
        card.setAttribute('aria-label', card.querySelector('h3')?.innerText || '游戏卡片');
      } else if (card.getAttribute('href') === '#') {
        card.setAttribute('aria-label', '开发中, 敬请期待');
      }
    });
    
    // 可选功能：统计点击英语学习卡片埋点（纯前端演示）
    if (englishDirectLink) {
      englishDirectLink.addEventListener('click', () => {
        // 轻量统计，无侵入
        if (window.gtag) {
          // 如果有分析代码可扩展，无则忽略
        }
      });
    }
  </script>
</body>
</html>
