<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>三年级下册 · 单元目录 | 2024外研版（三年级起点）英语</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Segoe UI', 'Poppins', 'Inter', system-ui, -apple-system, '微软雅黑', sans-serif;
      background: radial-gradient(circle at 10% 30%, #0f172a, #020617);
      min-height: 100vh;
      color: #eef5ff;
      padding: 20px 24px;
      position: relative;
      overflow-x: hidden;
    }

    /* 动态光晕背景 */
    body::before {
      content: '';
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 30% 40%, rgba(0, 200, 255, 0.06), rgba(100, 80, 220, 0.08));
      animation: slowRotate 32s linear infinite;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes slowRotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* 粒子容器 */
    #particlesContainer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      background: radial-gradient(circle, rgba(0, 210, 250, 0.4), rgba(120, 100, 255, 0.15));
      border-radius: 50%;
      animation: floatParticle 16s infinite ease-in-out;
    }

    @keyframes floatParticle {
      0% { transform: translateY(100vh) scale(0); opacity: 0; }
      25% { opacity: 0.6; }
      75% { opacity: 0.4; }
      100% { transform: translateY(-20vh) scale(1.1); opacity: 0; }
    }

    /* 主容器 */
    .main-wrapper {
      position: relative;
      z-index: 10;
      max-width: 1400px;
      margin: 0 auto;
    }

    /* 玻璃导航栏 */
    .glass-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 32px;
      padding: 8px 20px;
      background: rgba(15, 25, 55, 0.55);
      backdrop-filter: blur(16px);
      border-radius: 80px;
      border: 1px solid rgba(0, 210, 255, 0.35);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
    }

    .back-btn {
      background: rgba(0, 200, 240, 0.12);
      border: 1px solid rgba(0, 220, 255, 0.6);
      border-radius: 60px;
      padding: 8px 22px;
      color: #d6f0ff;
      text-decoration: none;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.25s ease;
      font-size: 0.9rem;
      cursor: pointer;
      letter-spacing: 0.3px;
    }

    .back-btn:hover {
      background: rgba(0, 210, 255, 0.28);
      border-color: #3efffa;
      transform: translateX(-4px);
      box-shadow: 0 0 12px rgba(0, 220, 255, 0.4);
    }

    .title-section {
      text-align: center;
      flex: 1;
    }

    .title-section h1 {
      font-size: clamp(1.3rem, 5vw, 2rem);
      background: linear-gradient(135deg, #b3f0ff, #a07eff, #ffa2d4);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: -0.3px;
      font-weight: 700;
    }

    .title-section p {
      color: #b4d0ff;
      font-size: 0.72rem;
      margin-top: 5px;
      opacity: 0.85;
    }

    .right-placeholder {
      width: 70px;
    }

    /* 单元网格 */
    .unit-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 28px;
      margin: 20px 0 40px;
    }

    .unit-card {
      background: rgba(18, 28, 55, 0.7);
      backdrop-filter: blur(12px);
      border-radius: 40px;
      padding: 28px 14px 24px;
      text-align: center;
      cursor: pointer;
      transition: all 0.35s cubic-bezier(0.2, 0.9, 0.4, 1.2);
      border: 1px solid rgba(0, 190, 240, 0.4);
      box-shadow: 0 12px 24px -12px rgba(0, 0, 0, 0.4);
      text-decoration: none;
      display: block;
      position: relative;
      overflow: hidden;
    }

    .unit-card::after {
      content: '';
      position: absolute;
      top: -30%;
      left: -30%;
      width: 160%;
      height: 160%;
      background: radial-gradient(circle, rgba(0, 230, 250, 0.08), transparent 70%);
      opacity: 0;
      transition: opacity 0.5s;
      pointer-events: none;
    }

    .unit-card:hover::after {
      opacity: 1;
    }

    .unit-card:hover {
      transform: translateY(-8px);
      border-color: #3efffa;
      box-shadow: 0 22px 32px -12px rgba(0, 210, 255, 0.35);
      background: rgba(30, 45, 85, 0.8);
    }

    .unit-card:active {
      transform: scale(0.97);
      transition: 0.05s;
    }

    .unit-number {
      font-size: 1rem;
      font-weight: 500;
      color: #7bc5ff;
      letter-spacing: 1.2px;
      margin-bottom: 12px;
      background: rgba(0, 160, 230, 0.2);
      display: inline-block;
      padding: 4px 14px;
      border-radius: 60px;
      backdrop-filter: blur(4px);
    }

    .unit-title {
      font-size: 1.25rem;
      font-weight: 700;
      background: linear-gradient(135deg, #ffffff, #c2e0ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      line-height: 1.35;
      margin: 12px 0 8px;
      word-break: break-word;
      padding: 0 6px;
    }

    .unit-theme {
      font-size: 0.72rem;
      color: #b1cbf5;
      margin-top: 8px;
      background: rgba(0, 20, 50, 0.4);
      display: inline-block;
      padding: 4px 14px;
      border-radius: 60px;
      letter-spacing: 0.5px;
    }

    /* 底部说明 */
    .footer-credit {
      text-align: center;
      font-size: 0.75rem;
      color: #7d9ed7;
      margin-top: 40px;
      padding: 20px 10px 10px;
      border-top: 1px solid rgba(0, 210, 255, 0.25);
      background: rgba(0, 0, 0, 0.2);
      border-radius: 60px;
      backdrop-filter: blur(5px);
    }

    /* 提示toast */
    .toast-tip {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(8, 12, 30, 0.92);
      backdrop-filter: blur(16px);
      color: #ffea9e;
      padding: 12px 24px;
      border-radius: 60px;
      border: 1px solid #ffbc6e;
      font-size: 0.85rem;
      font-weight: 500;
      z-index: 3000;
      white-space: nowrap;
      pointer-events: none;
      animation: fadeToast 2.2s ease forwards;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }

    @keyframes fadeToast {
      0% { opacity: 0; transform: translateX(-50%) translateY(16px); }
      18% { opacity: 1; transform: translateX(-50%) translateY(0); }
      82% { opacity: 1; transform: translateX(-50%) translateY(0); }
      100% { opacity: 0; transform: translateX(-50%) translateY(-10px); visibility: hidden; }
    }

    /* 响应式适配 */
    @media (max-width: 900px) {
      body {
        padding: 16px 20px;
      }
      .unit-grid {
        gap: 22px;
        grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      }
      .unit-title {
        font-size: 1.1rem;
      }
    }

    @media (max-width: 640px) {
      body {
        padding: 12px 16px;
      }
      .glass-nav {
        border-radius: 50px;
        padding: 6px 14px;
        gap: 8px;
      }
      .back-btn {
        padding: 6px 14px;
        font-size: 0.75rem;
      }
      .unit-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 14px;
      }
      .unit-card {
        padding: 18px 8px 16px;
        border-radius: 32px;
      }
      .unit-title {
        font-size: 0.95rem;
        margin: 8px 0 6px;
      }
      .unit-number {
        font-size: 0.72rem;
        padding: 3px 10px;
      }
      .unit-theme {
        font-size: 0.6rem;
        padding: 3px 10px;
      }
      .toast-tip {
        font-size: 0.7rem;
        white-space: nowrap;
        padding: 8px 18px;
      }
    }

    @media (max-width: 420px) {
      .unit-grid {
        gap: 10px;
      }
      .unit-title {
        font-size: 0.85rem;
      }
    }

    @media (orientation: landscape) and (max-height: 500px) {
      .unit-grid {
        gap: 14px;
      }
      .unit-card {
        padding: 14px 6px;
      }
    }
  </style>
</head>
<body>
<div id="particlesContainer"></div>

<div class="main-wrapper">
  <div class="glass-nav">
    <a href="javascript:void(0);" class="back-btn" id="backToMainBtn">
      <span>←</span> 返回年级选择
    </a>
    <div class="title-section">
      <h1>📖 三年级下册 · 单元目录</h1>
      <p>2024 外研版（三年级起点）· 新教材同步学习</p>
    </div>
    <div class="right-placeholder"></div>
  </div>

  <div class="unit-grid" id="unitGrid"></div>
  <div class="footer-credit">
    🌟 点击单元卡片，进入对应单元学习页面 <br>
    📚 依据 2024 外研版（三年级起点）新教材编制 | 电脑/手机完美适配
  </div>
</div>

<script>
  // 粒子背景（轻量优化）
  (function initParticles() {
    const container = document.getElementById('particlesContainer');
    if (!container) return;
    const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    const particleCount = isMobile ? 18 : 38;
    for (let i = 0; i < particleCount; i++) {
      const p = document.createElement('div');
      p.classList.add('particle');
      const size = Math.random() * 5 + 2.5;
      p.style.width = size + 'px';
      p.style.height = size + 'px';
      p.style.left = Math.random() * 100 + '%';
      p.style.background = `radial-gradient(circle, rgba(0, 210, 250, ${Math.random() * 0.5 + 0.2}), rgba(100, 80, 230, 0.2))`;
      p.style.animationDelay = Math.random() * 14 + 's';
      p.style.animationDuration = Math.random() * 12 + 12 + 's';
      container.appendChild(p);
    }
  })();

  /**
   * 2024 外研版（三年级起点）三年级下册 单元内容
   * 依据教材实际目录：
   * Unit 1 Animal friends        —— 动物朋友
   * Unit 2 Know your body        —— 认识身体
   * Unit 3 Yummy food            —— 美味食物
   * Unit 4 What's your hobby?    —— 你的爱好是什么？
   * Unit 5 What time is it?      —— 几点了？
   * Unit 6 A great week          —— 精彩一周
   * 
   * 数据来源：学科网、教习网等教学资源平台 [citation:1][citation:4][citation:6]
   */
  const unitsList = [
    { 
      id: 1, 
      unit: "Unit 1", 
      title: "Animal friends", 
      theme: "动物朋友 · 认识动物特征",
      description: "学习动物词汇，描述动物特征，培养爱护动物的意识",
      filename: "第一单元.html",
      icon: "🐼"
    },
    { 
      id: 2, 
      unit: "Unit 2", 
      title: "Know your body", 
      theme: "认识身体 · 五官与肢体",
      description: "学习身体部位词汇，了解五官功能，能用英语描述自己",
      filename: "第二单元.html",
      icon: "🦵"
    },
    { 
      id: 3, 
      unit: "Unit 3", 
      title: "Yummy food", 
      theme: "美味食物 · 饮食喜好",
      description: "学习食物词汇，表达喜好，了解健康饮食习惯",
      filename: "第三单元.html",
      icon: "🍎"
    },
    { 
      id: 4, 
      unit: "Unit 4", 
      title: "What's your hobby?", 
      theme: "兴趣爱好 · 多彩生活",
      description: "学习爱好词汇，询问和介绍爱好，培养积极兴趣",
      filename: "第四单元.html",
      icon: "🎨"
    },
    { 
      id: 5, 
      unit: "Unit 5", 
      title: "What time is it?", 
      theme: "时间管理 · 日常作息",
      description: "学习时间表达，描述日常活动，培养时间观念",
      filename: "第五单元.html",
      icon: "⏰"
    },
    { 
      id: 6, 
      unit: "Unit 6", 
      title: "A great week", 
      theme: "精彩一周 · 计划安排",
      description: "学习星期与活动词汇，规划一周生活，学会分享",
      filename: "第六单元.html",
      icon: "📅"
    }
  ];

  const unitGrid = document.getElementById('unitGrid');

  // 提示函数
  function showGentleTip(message, isError = false) {
    const existingTip = document.querySelector('.toast-tip');
    if (existingTip) existingTip.remove();
    const tipDiv = document.createElement('div');
    tipDiv.className = 'toast-tip';
    tipDiv.style.color = isError ? '#ffc6a5' : '#e7ffb0';
    tipDiv.style.borderColor = isError ? '#ff8a6f' : '#ffd966';
    tipDiv.innerText = message;
    document.body.appendChild(tipDiv);
    setTimeout(() => {
      if (tipDiv && tipDiv.remove) tipDiv.remove();
    }, 2200);
  }

  // 导航至单元页面
  function navigateToUnit(filename, displayName) {
    if (!filename) {
      showGentleTip(`✨ ${displayName} 即将开放，敬请期待`, false);
      return;
    }
    window.location.href = filename;
  }

  // 渲染单元卡片（2024外研版新教材）
  function renderUnits() {
    unitGrid.innerHTML = '';
    unitsList.forEach(unit => {
      const card = document.createElement('div');
      card.className = 'unit-card';
      card.setAttribute('data-unit', unit.unit);
      card.setAttribute('data-filename', unit.filename);
      
      card.innerHTML = `
        <div class="unit-number">${unit.unit}</div>
        <div class="unit-title">${unit.title}</div>
        <div class="unit-theme">${unit.theme}</div>
      `;
      
      card.addEventListener('click', (e) => {
        e.stopPropagation();
        navigateToUnit(unit.filename, `${unit.unit} ${unit.title}`);
      });
      unitGrid.appendChild(card);
    });
  }

  // 返回按钮逻辑（回到主英语学习页面）
  function setupBackButton() {
    const backBtn = document.getElementById('backToMainBtn');
    if (backBtn) {
      backBtn.addEventListener('click', (e) => {
        e.preventDefault();
        if (document.referrer && (document.referrer.includes('英语学习.html') || document.referrer.includes('index.html'))) {
          window.history.back();
        } else {
          window.location.href = '英语学习.html';
        }
      });
    }
  }

  // 添加触摸反馈
  function addTouchFeedback() {
    const cards = document.querySelectorAll('.unit-card');
    cards.forEach(card => {
      card.addEventListener('touchstart', function() {
        this.style.transform = 'scale(0.98)';
        setTimeout(() => { if (this) this.style.transform = ''; }, 120);
      });
      card.addEventListener('touchend', function() {
        setTimeout(() => { if (this) this.style.transform = ''; }, 80);
      });
    });
  }

  // 检测设备类型
  function detectDevice() {
    const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    document.body.classList.add(isMobile ? 'mobile-device' : 'desktop-device');
  }

  // 初始化
  renderUnits();
  setupBackButton();
  detectDevice();
  
  window.addEventListener('DOMContentLoaded', () => {
    addTouchFeedback();
  });
  
  // 监听动态变化
  const observer = new MutationObserver(() => {
    addTouchFeedback();
  });
  observer.observe(unitGrid, { childList: true, subtree: false });
  
  window.addEventListener('load', () => {
    console.log('2024外研版三年级下册目录已加载 — Unit 1~6 对应独立页面');
  });
</script>
</body>
</html>
