<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>第五单元 · 时间大冒险 | 2024外研版三年级下册</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Segoe UI', 'Poppins', 'Inter', system-ui, -apple-system, '微软雅黑', sans-serif;
      background: linear-gradient(145deg, #0b1120 0%, #111b3a 100%);
      min-height: 100vh;
      color: #eef5ff;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* 动态粒子背景 */
    #particlesCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      opacity: 0.4;
    }

    .game-container {
      position: relative;
      z-index: 10;
      max-width: 1300px;
      margin: 0 auto;
    }

    /* 玻璃导航栏 */
    .glass-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 28px;
      padding: 8px 20px;
      background: rgba(10, 20, 45, 0.65);
      backdrop-filter: blur(14px);
      border-radius: 80px;
      border: 1px solid rgba(0, 210, 255, 0.4);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }

    .back-btn {
      background: rgba(0, 200, 240, 0.15);
      border: 1px solid rgba(0, 220, 255, 0.6);
      border-radius: 60px;
      padding: 8px 22px;
      color: #d6f0ff;
      text-decoration: none;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: 0.25s;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .back-btn:hover {
      background: rgba(0, 210, 255, 0.3);
      border-color: #3efffa;
      transform: translateX(-4px);
    }

    .unit-badge {
      background: linear-gradient(135deg, #ffb347, #ff8c42);
      padding: 6px 20px;
      border-radius: 60px;
      font-weight: bold;
      font-size: 0.9rem;
      color: #fff;
      box-shadow: 0 2px 12px rgba(255, 140, 66, 0.4);
    }

    /* 主游戏面板 */
    .game-panel {
      background: rgba(12, 22, 48, 0.65);
      backdrop-filter: blur(16px);
      border-radius: 56px;
      padding: 28px 24px 36px;
      border: 1px solid rgba(0, 255, 210, 0.4);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      margin-bottom: 30px;
    }

    .game-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .game-header h2 {
      font-size: clamp(1.5rem, 6vw, 2.2rem);
      background: linear-gradient(135deg, #FFE6B0, #FFB347);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .game-header p {
      color: #b8d4ff;
      font-size: 0.9rem;
    }

    /* 计时器 & 得分栏 */
    .stats-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 60px;
      padding: 10px 20px;
      margin-bottom: 32px;
    }

    .score-box, .timer-box {
      background: rgba(0, 30, 60, 0.6);
      padding: 6px 20px;
      border-radius: 60px;
      font-weight: bold;
      font-size: 1.2rem;
      backdrop-filter: blur(5px);
      border-left: 3px solid #0ff;
    }

    .score-box span, .timer-box span {
      color: #ffde9c;
      margin-right: 8px;
    }

    /* 时钟展示区 */
    .clock-area {
      text-align: center;
      margin-bottom: 30px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 72px;
      padding: 20px;
    }

    .analog-clock {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: #fef9e8;
      margin: 0 auto 20px;
      position: relative;
      box-shadow: 0 0 0 6px rgba(0, 200, 255, 0.3), 0 12px 28px black;
    }

    .clock-face {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      position: relative;
      background: #fff6e5;
    }

    .hour-hand, .minute-hand {
      position: absolute;
      background: #2c3e66;
      transform-origin: 50% 100%;
      left: 50%;
      bottom: 50%;
      border-radius: 10px;
      transform: translateX(-50%) rotate(0deg);
    }

    .hour-hand {
      width: 6px;
      height: 45px;
      background: #1e2a47;
      margin-bottom: 0px;
    }

    .minute-hand {
      width: 4px;
      height: 65px;
      background: #ff8c42;
    }

    .center-dot {
      position: absolute;
      width: 10px;
      height: 10px;
      background: #ffaa44;
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 5;
    }

    .digital-time {
      font-size: 2rem;
      font-weight: bold;
      background: #0a1028;
      display: inline-block;
      padding: 8px 24px;
      border-radius: 60px;
      font-family: monospace;
      letter-spacing: 3px;
      color: #7efff0;
      box-shadow: inset 0 0 6px #0ff, 0 4px 12px black;
    }

    /* 选项区 (游戏卡片) */
    .options-area {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 18px;
      margin: 30px 0 25px;
    }

    .time-card {
      background: rgba(20, 35, 70, 0.8);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(0, 200, 255, 0.5);
      border-radius: 48px;
      padding: 18px 10px;
      text-align: center;
      font-size: 1.3rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
      color: #f0f9ff;
      letter-spacing: 1px;
    }

    .time-card:hover {
      transform: scale(1.02);
      background: rgba(0, 180, 230, 0.3);
      border-color: cyan;
      box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
    }

    .time-card.correct-feedback {
      animation: pulseCorrect 0.4s ease;
      background: #2e7d64;
      border-color: #9effcf;
    }

    .time-card.wrong-feedback {
      animation: shakeWrong 0.3s ease;
      background: #a03e3e;
    }

    @keyframes pulseCorrect {
      0% { transform: scale(1); background: #2e7d64; }
      50% { transform: scale(1.05); background: #4caf7f; }
      100% { transform: scale(1); }
    }

    @keyframes shakeWrong {
      0% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
      100% { transform: translateX(0); }
    }

    /* 反馈消息 */
    .feedback-msg {
      text-align: center;
      font-size: 1.1rem;
      padding: 12px;
      background: rgba(0, 20, 40, 0.6);
      border-radius: 60px;
      margin-top: 12px;
      transition: 0.2s;
    }

    .next-btn {
      background: linear-gradient(95deg, #ffb347, #ff8c42);
      border: none;
      padding: 12px 32px;
      border-radius: 60px;
      font-weight: bold;
      font-size: 1rem;
      color: #1e1a2f;
      cursor: pointer;
      transition: 0.2s;
      margin-top: 18px;
      display: inline-block;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.3);
    }

    .next-btn:hover {
      transform: scale(1.02);
      background: #ffaa55;
      box-shadow: 0 0 16px #ffaa55;
    }

    /* 游戏结束面板 */
    .game-over-panel {
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(12px);
      border-radius: 56px;
      padding: 32px;
      text-align: center;
      margin-top: 20px;
    }

    .restart-btn {
      background: #4caf50;
      border: none;
      padding: 12px 28px;
      border-radius: 60px;
      font-weight: bold;
      margin-top: 16px;
      cursor: pointer;
      font-size: 1rem;
    }

    /* 移动端调整 */
    @media (max-width: 600px) {
      .game-panel {
        padding: 20px 16px;
      }
      .analog-clock {
        width: 140px;
        height: 140px;
      }
      .hour-hand {
        height: 35px;
        width: 5px;
      }
      .minute-hand {
        height: 50px;
        width: 4px;
      }
      .digital-time {
        font-size: 1.5rem;
        padding: 5px 16px;
      }
      .time-card {
        font-size: 1rem;
        padding: 14px 6px;
      }
      .stats-bar {
        flex-direction: column;
        align-items: stretch;
        text-align: center;
      }
    }
  </style>
</head>
<body>
<canvas id="particlesCanvas"></canvas>

<div class="game-container">
  <div class="glass-nav">
    <a href="javascript:history.back()" class="back-btn">← 返回单元目录</a>
    <div class="unit-badge">Unit 5 · What time is it?</div>
    <div style="width: 40px;"></div>
  </div>

  <div class="game-panel" id="gamePanel">
    <div class="game-header">
      <h2>⏰ 时间大冒险 · 报时挑战</h2>
      <p>看时钟 → 选择正确的时间英文表达 | 2024外研版三年级下册</p>
    </div>

    <div class="stats-bar">
      <div class="score-box"><span>🎯 得分</span> <span id="scoreValue">0</span></div>
      <div class="timer-box"><span>⏱️ 剩余</span> <span id="timerValue">00:00</span></div>
    </div>

    <div class="clock-area">
      <div class="analog-clock" id="analogClock">
        <div class="clock-face">
          <div class="hour-hand" id="hourHand"></div>
          <div class="minute-hand" id="minuteHand"></div>
          <div class="center-dot"></div>
        </div>
      </div>
      <div class="digital-time" id="digitalPlaceholder">--:--</div>
    </div>

    <div class="options-area" id="optionsContainer"></div>
    <div class="feedback-msg" id="feedbackMsg">✨ 点击卡片，选择正确的时间～ ✨</div>
    <div style="text-align: center;">
      <button class="next-btn" id="nextQuestionBtn">🎲 下一题 ➡</button>
    </div>
  </div>
</div>

<script>
  // 粒子背景绘制 (轻量)
  const canvas = document.getElementById('particlesCanvas');
  let ctx = canvas.getContext('2d');
  let width, height;
  let particles = [];

  function resizeCanvas() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;
  }

  function initParticles() {
    const particleCount = Math.min(60, Math.floor(width * height / 8000));
    for (let i = 0; i < particleCount; i++) {
      particles.push({
        x: Math.random() * width,
        y: Math.random() * height,
        radius: Math.random() * 3 + 1,
        alpha: Math.random() * 0.4 + 0.1,
        speedX: (Math.random() - 0.5) * 0.3,
        speedY: (Math.random() - 0.5) * 0.2
      });
    }
  }

  function drawParticles() {
    if (!ctx) return;
    ctx.clearRect(0, 0, width, height);
    ctx.fillStyle = '#0a0f1e';
    ctx.fillRect(0, 0, width, height);
    for (let p of particles) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(100, 200, 255, ${p.alpha})`;
      ctx.fill();
      p.x += p.speedX;
      p.y += p.speedY;
      if (p.x < 0) p.x = width;
      if (p.x > width) p.x = 0;
      if (p.y < 0) p.y = height;
      if (p.y > height) p.y = 0;
    }
    requestAnimationFrame(drawParticles);
  }

  window.addEventListener('resize', () => {
    resizeCanvas();
    particles = [];
    initParticles();
  });
  resizeCanvas();
  initParticles();
  drawParticles();

  // -------------------- 游戏核心逻辑 --------------------
  // 2024外研版第五单元核心时间词汇：整点、半点，并包含日常活动对应时间
  const timeQuestions = [
    { hour: 7, minute: 0, display: "7:00", textEn: "seven o'clock" },
    { hour: 8, minute: 0, display: "8:00", textEn: "eight o'clock" },
    { hour: 9, minute: 0, display: "9:00", textEn: "nine o'clock" },
    { hour: 10, minute: 0, display: "10:00", textEn: "ten o'clock" },
    { hour: 11, minute: 0, display: "11:00", textEn: "eleven o'clock" },
    { hour: 12, minute: 0, display: "12:00", textEn: "twelve o'clock" },
    { hour: 2, minute: 30, display: "2:30", textEn: "half past two" },
    { hour: 3, minute: 30, display: "3:30", textEn: "half past three" },
    { hour: 4, minute: 30, display: "4:30", textEn: "half past four" },
    { hour: 5, minute: 30, display: "5:30", textEn: "half past five" },
    { hour: 6, minute: 30, display: "6:30", textEn: "half past six" },
    { hour: 1, minute: 30, display: "1:30", textEn: "half past one" }
  ];

  let currentQuestion = null;
  let currentOptions = [];
  let score = 0;
  let timeLeft = 60;        // 60秒计时
  let timerInterval = null;
  let gameActive = true;
  let waitingNext = false;

  const scoreSpan = document.getElementById('scoreValue');
  const timerSpan = document.getElementById('timerValue');
  const optionsContainer = document.getElementById('optionsContainer');
  const feedbackDiv = document.getElementById('feedbackMsg');
  const nextBtn = document.getElementById('nextQuestionBtn');
  const hourHand = document.getElementById('hourHand');
  const minuteHand = document.getElementById('minuteHand');
  const digitalSpan = document.getElementById('digitalPlaceholder');

  // 更新钟表指针
  function updateClockHands(hour, minute) {
    let hourAngle = (hour % 12) * 30 + minute * 0.5;
    let minuteAngle = minute * 6;
    if (hourHand) hourHand.style.transform = `translateX(-50%) rotate(${hourAngle}deg)`;
    if (minuteHand) minuteHand.style.transform = `translateX(-50%) rotate(${minuteAngle}deg)`;
    let displayHour = hour % 12 === 0 ? 12 : hour % 12;
    let minuteStr = minute < 10 ? '0' + minute : minute;
    digitalSpan.innerText = `${displayHour}:${minuteStr}`;
  }

  // 洗牌函数
  function shuffleArray(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  // 生成选项 (包含正确+随机其他3个不同时间)
  function generateOptions(correctItem, allQuestions) {
    let others = allQuestions.filter(q => q.display !== correctItem.display).map(q => q.textEn);
    let uniqueOthers = [...new Set(others)];
    let shuffledOthers = shuffleArray([...uniqueOthers]);
    let selected = shuffledOthers.slice(0, 3);
    let opts = [correctItem.textEn, ...selected];
    return shuffleArray(opts);
  }

  // 加载新题目
  function loadNewQuestion() {
    if (!gameActive) return;
    if (waitingNext) waitingNext = false;
    // 随机抽取时间题目
    const randomIndex = Math.floor(Math.random() * timeQuestions.length);
    currentQuestion = { ...timeQuestions[randomIndex] };
    currentOptions = generateOptions(currentQuestion, timeQuestions);
    // 更新表盘
    updateClockHands(currentQuestion.hour, currentQuestion.minute);
    // 渲染选项
    renderOptions(currentOptions);
    feedbackDiv.innerHTML = '⏳ 选择一个正确的时间表达～';
    feedbackDiv.style.color = '#ccddff';
  }

  // 渲染游戏选项
  function renderOptions(options) {
    optionsContainer.innerHTML = '';
    options.forEach(optText => {
      const card = document.createElement('div');
      card.className = 'time-card';
      card.innerText = optText;
      card.addEventListener('click', (e) => {
        e.stopPropagation();
        if (!gameActive || waitingNext) {
          feedbackDiv.innerHTML = waitingNext ? '🎮 点击「下一题」继续挑战' : '游戏已结束，请重新开始';
          return;
        }
        handleAnswer(optText, card);
      });
      optionsContainer.appendChild(card);
    });
  }

  // 处理答案
  function handleAnswer(selected, cardElement) {
    if (!currentQuestion) return;
    const isCorrect = (selected === currentQuestion.textEn);
    if (isCorrect) {
      score += 10;
      scoreSpan.innerText = score;
      feedbackDiv.innerHTML = '✅ 完美！ +10分！ ' + currentQuestion.textEn + ' 时间正确！';
      feedbackDiv.style.color = '#b9ffb0';
      cardElement.classList.add('correct-feedback');
      setTimeout(() => cardElement.classList.remove('correct-feedback'), 400);
      // 正确后直接加载下一题（自动跳转，给予流畅体验）
      waitingNext = true;
      setTimeout(() => {
        if (gameActive) {
          loadNewQuestion();
        }
      }, 500);
    } else {
      feedbackDiv.innerHTML = `❌ 噢不！正确答案是 “${currentQuestion.textEn}”。 继续加油～`;
      feedbackDiv.style.color = '#ffbc9a';
      cardElement.classList.add('wrong-feedback');
      setTimeout(() => cardElement.classList.remove('wrong-feedback'), 400);
      // 答错不扣分，但显示错误后不变题，直到点击下一题
      waitingNext = true;
    }
  }

  // 手动下一题 (当答错或者需要跳过)
  function manualNext() {
    if (!gameActive) {
      return;
    }
    if (waitingNext || true) {
      loadNewQuestion();
      waitingNext = false;
    } else {
      // 如果没有等待状态 直接刷新
      loadNewQuestion();
    }
  }

  // 计时器
  function startTimer() {
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      if (!gameActive) return;
      if (timeLeft <= 1) {
        // 游戏结束
        clearInterval(timerInterval);
        gameActive = false;
        timerSpan.innerText = '00:00';
        endGame();
      } else {
        timeLeft--;
        let minutes = Math.floor(timeLeft / 60);
        let seconds = timeLeft % 60;
        timerSpan.innerText = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
      }
    }, 1000);
  }

  // 游戏结束
  function endGame() {
    gameActive = false;
    if (timerInterval) clearInterval(timerInterval);
    optionsContainer.innerHTML = '';
    const gamePanel = document.getElementById('gamePanel');
    const originalContent = gamePanel.innerHTML;
    const gameOverDiv = document.createElement('div');
    gameOverDiv.className = 'game-over-panel';
    gameOverDiv.innerHTML = `
      <h2>🎉 游戏结束 🎉</h2>
      <p style="font-size:1.6rem; margin: 20px 0;">你的总分: ${score} 分</p>
      <p>⭐ 时间管家小英雄！继续练习会更棒~</p>
      <button class="restart-btn" id="restartGameBtn">🔄 重新挑战</button>
    `;
    gamePanel.innerHTML = '';
    gamePanel.appendChild(gameOverDiv);
    const restartBtn = document.getElementById('restartGameBtn');
    if (restartBtn) {
      restartBtn.addEventListener('click', () => {
        location.reload();
      });
    }
  }

  // 重置开始游戏 (初次启动)
  function initGame() {
    score = 0;
    timeLeft = 60;
    gameActive = true;
    waitingNext = false;
    scoreSpan.innerText = "0";
    let minutes = Math.floor(timeLeft / 60);
    let seconds = timeLeft % 60;
    timerSpan.innerText = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
    loadNewQuestion();
    startTimer();
  }

  // 绑定下一题按钮
  nextBtn.addEventListener('click', () => {
    if (!gameActive) return;
    manualNext();
  });

  // 触摸优化防止按钮误触
  const styleTouch = document.createElement('style');
  styleTouch.textContent = `
    .time-card, .next-btn, .back-btn, .restart-btn {
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
  `;
  document.head.appendChild(styleTouch);

  // 页面启动
  initGame();
</script>
</body>
</html>
